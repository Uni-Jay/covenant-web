name: Keep the church server awake

# Render's free plan puts the server to sleep after 15 minutes without visitors,
# and the first visitor then waits about a minute. This pings it every 10 minutes
# from 5am to 11pm Lagos time (04:00-22:00 UTC). It rests overnight so the month
# stays inside Render's 750 free hours.
on:
  schedule:
    - cron: '*/10 4-21 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the server
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 90 https://covenant-server-1.onrender.com/api/health; then exit 0; fi
            sleep 20
          done
          echo "The server did not answer. Check it on the Render dashboard."
          exit 1
